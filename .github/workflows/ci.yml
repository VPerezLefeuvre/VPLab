name: VPLab CI

on:
  push:
    branches: [ dev, master ]

  pull_request:
    branches: [ dev, master ]

jobs:

  backend-check:
    name: Backend Build & Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Package
        working-directory: backend
        run: mvn -B clean package -DskipTests

  frontend-check:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Static Analysis (Types & Lint)
        run: |
          cd frontend
          npx tsc --noEmit
          npm run lint

      - name: Production Build
        run: cd frontend && npm run build

  production-health-check:
    name: Full-Stack Docker Integration Test
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spin up Docker containers
        run: docker compose up -d --build

      - name: Wait for Actuator Health Check
        run: |
          echo "Checking system availability..."
          timeout 60s bash -c 'until curl -s http://localhost:8080/actuator/health | grep "UP"; do sleep 5; done'
          echo "Success: Backend is responding!"

      - name: Verify Cross-Service Connectivity
        run: |
          docker exec vplab-frontend wget -qO- http://vplab-backend:8080/actuator/health
